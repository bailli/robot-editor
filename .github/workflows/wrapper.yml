# The native Linux wrapper (tools/linux): built when it changes and kept as an artifact,
# robot-linux-i386 (a 32-bit Linux program; it needs SDL2 for i386 to run, see the README).
name: Linux wrapper

on:
  push:
    branches: [main]
    paths: ["tools/linux/**", ".github/workflows/wrapper.yml"]
  pull_request:
    paths: ["tools/linux/**", ".github/workflows/wrapper.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 32-bit toolchain and SDL2
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libsdl2-dev:i386
      # the build command is package.json's (no dependencies needed for it)
      - run: pnpm wrapper
      # without the game: the loader starts and the settings file works
      - run: ROBOT_REGISTRY="$RUNNER_TEMP/registry.reg" tools/linux/robot --settings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robot-linux-i386
          path: tools/linux/robot
          if-no-files-found: error
