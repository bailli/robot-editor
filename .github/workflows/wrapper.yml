# The native Linux wrapper (tools/linux): built when it changes and kept as an artifact,
# robot-linux-i386 (a 32-bit Linux program; it needs SDL2 for i386 to run, see the README).
# From main it also replaces the rolling pre-release linux-wrapper (a stable download link).
name: Linux wrapper

on:
  push:
    branches: [main]
    paths: ["tools/linux/**", "package.json", ".github/workflows/wrapper.yml"]
  pull_request:
    paths: ["tools/linux/**", "package.json", ".github/workflows/wrapper.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # pnpm runs the build command: the Node package.json asks for, as in ci.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 32-bit toolchain and SDL2
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libsdl2-dev:i386
      # the build command is package.json's (no dependencies needed for it)
      - run: pnpm wrapper
      # without the game: the loader starts and the settings file works
      - run: ROBOT_REGISTRY="$RUNNER_TEMP/registry.reg" tools/linux/robot --settings
      # in a tar: an artifact's zip would drop the executable bit
      - run: tar -czf robot-linux-i386.tar.gz -C tools/linux robot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robot-linux-i386
          path: robot-linux-i386.tar.gz
          if-no-files-found: error

  # the rolling pre-release: its tag moves to the commit built, its file is replaced
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: robot-linux-i386
      - name: Replace the pre-release linux-wrapper
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # replaced in place (never deleted first: a failed step leaves the last build); its
        # tag moves to the commit built
        run: |
          tar -xzf robot-linux-i386.tar.gz
          mv robot robot-linux-i386
          notes="The native Linux wrapper built from ${GITHUB_SHA::7} (tools/linux, see the README). A 32-bit program: \`chmod +x robot-linux-i386\`; it needs SDL2 for i386 (\`dpkg --add-architecture i386\`, \`apt install libsdl2-2.0-0:i386\`). Run it with your own GameOfRobot.exe: \`./robot-linux-i386 GAME_DIR/GameOfRobot.exe\`."
          if gh release view linux-wrapper > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/linux-wrapper" -f sha="$GITHUB_SHA" -F force=true
            gh release upload linux-wrapper robot-linux-i386 --clobber
            gh release edit linux-wrapper --notes "$notes"
          else
            gh release create linux-wrapper robot-linux-i386 --prerelease --target "$GITHUB_SHA" \
              --title "Linux wrapper (latest build)" --notes "$notes"
          fi
